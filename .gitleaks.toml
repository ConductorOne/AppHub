# A YAML mapping line inside Go source, with the value written in full.
#
# An embedded YAML document in a raw string was a real bypass, and the block
# scalar half of it is closed by `apphub-hostname-block-scalar-indicator`. The
# other half is the plain scalar -- `key: value`, value on the same line --
# which the two-label rule reached in .go files through its `:` branch, and
# which that rule's Go exemption would otherwise drop.
#
# That `:` branch is also what made `Host: rec.name` a finding, because a Go
# composite literal field is written the same way. What separates them is not
# spelling: gofmt puts a trailing comma on every field of a multi-line composite
# literal, so a Go field value never ends its line, and a YAML plain scalar
# always does. Requiring the value to run to the end of the line keeps the YAML
# and drops the Go.
#
# Like the other context-anchored rules, this one requires no known suffix. A
# YAML value cannot be an identifier, so there is nothing to disambiguate and no
# reason to be anything but fail-closed.

  [[rules.allowlists]]
  description = "structured-data keys whose last label is a registrable suffix"
  regexTarget = "secret"
  regexes = [
    # A map key labelling the parts of an endpoint, in the conformance suite's
    # observed-state map. `host` is a gTLD, so the key is character-for-character
    # a two-label host in the one position this rule keys on -- alone inside a
    # string literal -- while its siblings `endpoint.port` and
    # `endpoint.database` are not registrable suffixes and never fire. The key is
    # not renamed to dodge the scanner: the siblings set the convention, and
    # contorting code to satisfy a tool is how a gate starts costing more than it
    # returns.
    #
    # Exact-anchored, one label pair, nothing widened. This block is deliberately
    # separate from the public-hosts list above, because that list means "hosts
    # that resolve" and one of them (Datadog) IS a security control; an entry
    # that is not a host at all does not belong in it. Anything added here must
    # be a key, must be anchored at both ends, and must be justified in a comment
    # -- an allowlist is precisely where an internal host would hide.
    '''^endpoint\.host$''',
    # Operator configuration field name used for required-field diagnostics.
    '''^placement\.vpc$''',
  ]
[[rules]]
id = "apphub-hostname-go-yaml-key"
description = "hostname as the whole value of a YAML mapping line in Go source, as in an embedded manifest"
path = '''\.go$'''
regex = '''(?m)^[ \t]*[A-Za-z0-9_.-]+:[ \t]*((?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63})[ \t]*$'''
secretGroup = 1
tags = ["disclosure", "hostname"]

