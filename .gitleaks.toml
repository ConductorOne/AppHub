lamborghini|lamer|lan|land|landrover|lanxess|lasalle|lat|latino|latrobe|law|lawyer|lb|lc|lds|lease|leclerc|lefrak|legal|lego|lexus|lgbt|li|lidl|life|lifeinsurance|lifestyle|lighting|like|lilly|limited|limo|lincoln|link|live|living|lk|llc|llp|loan|loans|local|localdomain|localhost|locker|locus|lol|london|lotte|lotto|love|lpl|lplfinancial|lr|ls|lt|ltd|ltda|lu|lundbeck|luxe|luxury|lv|ly|ma|madrid|maif|maison|makeup|man|management|mango|map|market|marketing|markets|marriott|marshalls|mattel|mba|mc|mckinsey|md|me|med|media|meet|melbourne|meme|memorial|men|menu|merck|merckmsd|mg|mh|miami|microsoft|mil|mini|mint|mit|mitsubishi|mk|ml|mlb|mls|mm|mma|mn|mo|mobi|mobile|moda|moe|moi|mom|monash|money|monster|mormon|mortgage|moscow|moto|motorcycles|mov|movie|mp|mq|mr|ms|msd|mt|mtn|mtr|mu|museum|music|mv|mw|mx|my|mz|na|nab|nagoya|name|navy|nba|nc|ne|nec|net|netbank|netflix|network|neustar|new|news|next|nextdirect|nexus|nf|nfl|ng|ngo|nhk|ni|nico|nike|nikon|ninja|nissan|nissay|nl|no|nokia|norton|now|nowruz|nowtv|np|nr|nra|nrw|ntt|nu|nyc|nz|obi|observer|office|okinawa|olayan|olayangroup|ollo|om|omega|one|ong|onl|online|ooo|open|oracle|orange|org|organic|origins|osaka|otsuka|ott|ovh|pa|page|panasonic|paris|pars|partners|parts|party|pay|pccw|pe|pet|pf|pfizer|pg|ph|pharmacy|phd|philips|phone|photo|photography|photos|physio|pics|pictet|pictures|pid|pin|ping|pink|pioneer|pizza|pk|pl|place|play|playstation|plumbing|plus|pm|pn|pnc|pohl|poker|politie|porn|post|pr|praxi|press|prime|private|pro|prod|productions|prof|progressive|promo|properties|property|protection|pru|prudential|ps|pt|pub|pw|pwc|py|qa|qpon|quebec|quest|racing|radio|re|read|realestate|realtor|realty|recipes|red|redumbrella|rehab|reise|reisen|reit|reliance|ren|rent|rentals|repair|report|republican|rest|restaurant|review|reviews|rexroth|rich|richardli|ricoh|ril|rio|rip|ro|rocks|rodeo|rogers|room|rs|rsvp|ru|rugby|ruhr|run|rw|rwe|ryukyu|sa|saarland|safe|safety|sakura|sale|salon|samsclub|samsung|sandvik|sandvikcoromant|sanofi|sap|sarl|sas|save|saxo|sb|sbi|sbs|sc|scb|schaeffler|schmidt|scholarships|school|schule|schwarz|science|scot|sd|se|search|seat|secure|security|seek|select|sener|services|seven|sew|sex|sexy|sfr|sg|sh|shangrila|sharp|shell|shia|shiksha|shoes|shop|shopping|shouji|show|si|silk|sina|singles|site|sj|sk|ski|skin|sky|skype|sl|sling|sm|smart|smile|sn|sncf|so|soccer|social|softbank|software|sohu|solar|solutions|song|sony|soy|spa|space|sport|spot|sr|srl|ss|st|stada|staples|star|statebank|statefarm|stc|stcgroup|stockholm|storage|store|stream|studio|study|style|su|sucks|supplies|supply|support|surf|surgery|suzuki|sv|svc|swatch|swiss|sx|sy|sydney|systems|sz|tab|taipei|talk|taobao|target|tatamotors|tatar|tattoo|tax|taxi|tc|tci|td|tdk|team|tech|technology|tel|temasek|tennis|test|teva|tf|tg|th|thd|theater|theatre|tiaa|tickets|tienda|tips|tires|tirol|tj|tjmaxx|tjx|tk|tkmaxx|tl|tm|tmall|tn|to|today|tokyo|tools|top|toray|toshiba|total|tours|town|toyota|toys|tr|trade|trading|training|travel|travelers|travelersinsurance|trust|trv|tt|tube|tui|tunes|tushu|tv|tvs|tw|tz|ua|ubank|ubs|ug|uk|unicom|university|uno|uol|ups|us|uy|uz|va|vacations|vana|vanguard|vc|ve|vegas|ventures|verisign|versicherung|vet|vg|vi|viajes|video|vig|viking|villas|vin|vip|virgin|visa|vision|viva|vivo|vlaanderen|vn|vodka|volvo|vote|voting|voto|voyage|vpc|vu|wales|walmart|walter|wang|wanggou|watch|watches|weather|weatherchannel|web|webcam|weber|website|wed|wedding|weibo|weir|wf|whoswho|wien|wiki|williamhill|win|windows|wine|winners|wme|woodside|work|works|world|wow|ws|wtc|wtf|xbox|xerox|xihuan|xin|xxx|xyz|yachts|yahoo|yamaxun|yandex|ye|yodobashi|yoga|yokohama|you|youtube|yt|yun|za|zappos|zara|zero|zip|zm|zone|zuerich|zw)\b'''
tags = ["disclosure", "hostname"]

  [[rules.allowlists]]
  description = "public hosts this repository legitimately references"
  regexTarget = "match"
  regexes = [
    # Vendor API roots the credential providers must name in code. Each one is a
    # public, documented endpoint that resolves in public DNS -- verified rather
    # than taken on trust, since a hostname allowlist is exactly where an
    # internal host could hide behind a plausible-looking public one. Every
    # entry is exact-anchored: no apex is widened. For Datadog the list IS the
    # security control -- credentials/datadog refuses to send an admin key to any
    # host outside it (USOSS-7).
    '''^api\.openai\.com$''',
    '''^api\.github\.com$''',
    # Google OIDC's documented issuer and the upstream Go YAML module host.
    '''^accounts\.google\.com$''',
    '''^go\.yaml\.in$''',
    '''^api\.datadoghq\.com$''',
    '''^api\.datadoghq\.eu$''',
    '''^api\.us3\.datadoghq\.com$''',
    '''^api\.us5\.datadoghq\.com$''',
    '''^api\.ap1\.datadoghq\.com$''',
    '''^api\.ddog-gov\.com$''',
    # Us, in public. Only these hosts -- any other label under either apex is
    # an internal service name and is exactly what this rule exists to catch.
    '''^www\.conductorone\.com$''',
    '''^www\.c1\.ai$''',
    # Source control, the module proxy, and the checksum database.
    '''^raw\.githubusercontent\.com$''',
    '''^objects\.githubusercontent\.com$''',
    '''^users\.noreply\.github\.com$''',
    '''^docs\.github\.com$''',
    # The portal's Google Fonts stylesheet import (frontend/src/styles.css).
    '''^fonts\.googleapis\.com$''',
    '''^proxy\.golang\.org$''',
    '''^sum\.golang\.org$''',
    '''^pkg\.go\.dev$''',
    # Licences, governance, and the security contact's own publications.
    '''^www\.apache\.org$''',
    '''^www\.contributor-covenant\.org$''',
    # Placeholder domains reserved by RFC 2606 / RFC 6761 for documentation.
    '''^([a-z0-9-]+\.)*example\.(com|net|org)$''',
    '''^([a-z0-9-]+\.)*example$''',
    '''^([a-z0-9-]+\.)*invalid$''',
    '''^([a-z0-9-]+\.)*test$''',
    '''^([a-z0-9-]+\.)*localhost$''',
    # Kubernetes API group names and the cluster-internal DNS suffix, added by
    # USOSS-27. These are shaped like hostnames and are not hosts: an API group
    # is an identifier in the Kubernetes type system, and a provider that could
    # not name one could not write an object. Exact-anchored, so no apex is
    # widened -- in particular svc.cluster.local is allowed as the bare suffix
    # only, because a full <service>.<namespace>.svc.cluster.local name would
    # disclose an internal service and namespace and must stay a finding.
    '''^kubernetes\.io$''',
    '''^app\.kubernetes\.io$''',
    '''^kubectl\.kubernetes\.io$''',
    '''^networking\.k8s\.io$''',
    '''^gateway\.networking\.k8s\.io$''',
    '''^rbac\.authorization\.k8s\.io$''',
    '''^postgresql\.cnpg\.io$''',
    # The Kubernetes module apexes, added by USOSS-15. They appear in Go source
    # as import-path prefixes in the deploy module's substrate fence -- the rule
    # naming what modules/deploy may not depend on -- not as hosts anything
    # connects to. Exact-anchored like every entry here, so internal.k8s.io and
    # anything else under either apex stays a finding; hack/check-secret-rules.sh
    # asserts that.
    '''^k8s\.io$''',
    '''^sigs\.k8s\.io$''',
    '''^svc\.cluster\.local$''',
    # Public hosts the AWS deployment under terraform/ names. Each one is a
    # documented, publicly resolving endpoint and none of them is ours:
    # registry.terraform.io is where the provider lock file records what it
    # pinned, public.ecr.aws is AWS's public gallery, and the two ACME
    # directories are Let's Encrypt's -- the staging one exists so that bringing
    # the ingress up does not spend a week of production issuance quota.
    # Exact-anchored like every entry here, so no apex is widened.
    '''^registry\.terraform\.io$''',
    '''^public\.ecr\.aws$''',
    '''^acme-v02\.api\.letsencrypt\.org$''',
    '''^acme-staging-v02\.api\.letsencrypt\.org$''',
    # AWS *service* endpoints only -- global (s3.amazonaws.com) and regional
    # (dynamodb.us-east-1.amazonaws.com). Deliberately NOT the whole domain:
    # review pointed out that a blanket amazonaws.com exception waves through
    # prod-db.abc123.us-east-1.rds.amazonaws.com, which is a deployment-specific
    # endpoint and precisely the infrastructure detail this rule is for.
    '''^[a-z0-9-]+\.amazonaws\.com$''',
    '''^[a-z0-9-]+\.[a-z]{2}-[a-z]+-[0-9]\.amazonaws\.com$''',
    # AWS's own public documentation and the RDS regional trust-bundle host
    # (terraform/README.md), which operators are told to download from by name.
    '''^docs\.aws\.amazon\.com$''',
    '''^truststore\.pki\.rds\.amazonaws\.com$''',
  ]

  [[rules.allowlists]]
  description = "file names, which are shaped like hostnames and are not hosts"
  regexTarget = "match"
  regexes = [
    '''\.(go|md|yml|yaml|toml|json|sum|mod|sh|txt|html|css|js|ts|py|tf|lock|tmpl|gotmpl)$''',
  ]

  [[rules.allowlists]]
  description = "exact label and option keys in the AWS deployment, which are namespaces and not hosts"
  condition = "AND"
  paths = ['''(?:^|/)terraform/.*\.(tf|tftpl)$''']
  regexTarget = "match"
  # The same class compute/aws/routes.go splits its namespace constant to avoid:
  # a reverse-proxy label key and a container-runtime network option are both
  # shaped like hostnames and neither is one. They cannot be split here, because
  # Terraform is writing the literal key a daemon reads. Exact-anchored, so a
  # real host in the same file stays a finding.
  regexes = [
    '''^traefik\.http\.services$''',
    '''^traefik\.http\.routers$''',
    '''^traefik\.http\.middlewares$''',
    '''^com\.docker\.network$''',
    '''^com\.docker\.network\.bridge\.name$''',
    '''^com\.docker\.network\.bridge\.enable_icc$''',
    # An HCL property-access expression, not a DNS name.
    '''^each\.value\.name$''',
  ]

  [[rules.allowlists]]
  description = "placeholder tenant URL in the example tfvars, not a real host"
  condition = "AND"
  paths = ['''(?:^|/)terraform/environments/example/terraform\.tfvars\.example$''']
  regexTarget = "match"
  regexes = ['''^tenant\.conductor\.one$''']

  [[rules.allowlists]]
  description = "Go source, where this rule cannot tell a selector chain from a host"
  # Not a hostname exception: the same shapes are matched in .go files by the
  # three rules below, which require the token to be data rather than an
  # expression. Removing this without removing those re-opens 218 findings of
  # ordinary Go on the first large port.
  paths = ['''\.go$''']

  [[rules.allowlists]]
  description = "exact property-access expressions in the authored React portal, not DNS names"
  condition = "AND"
  paths = ['''(?:^|/)frontend/src/.*\.tsx?$''']
  regexTarget = "match"
  # Keep source files under all secret/URL rules. These are reviewed expression
  # names, not a blanket TypeScript exemption or permission for their subdomains.
  regexes = [
    '''^app\.specification\.name$''',
    '''^session\.identity\.email$''',
    '''^consent\.identity\.email$''',
    '''^consent\.scopes\.map$''',
    '''^providers\.data\.providers\.map$''',
    '''^query\.state\.data$''',
    '''^input\.bucket\.zone$''',
    '''^p\.advisories\.map$''',
    '''^secrets\.items\.map$''',
    '''^section\.pages\.map$''',
    '''^app\.owners\.map$''',
    '''^c\.can\.map$''',
    '''^c\.cannot\.map$''',
    '''^data\.installations\.map$''',
    '''^g\.items\.map$''',
    '''^page\.lede\.map$''',
    '''^page\.toc\.map$''',
    '''^r\.env\.map$''',
    '''^r\.stats\.map$''',
    '''^target\.repositories\.map$''',
    '''^targets\.data\.map$''',
    '''^token\.rows\.map$''',
    '''^usage\.buckets\.map$''',
    '''^application\.specification\.name$''',
  ]

# Two labels, as a value rather than as an identifier.
#
# The general rule above needs three labels, because `boundary.go` and `ci.yml`
# are shaped exactly like two-label hostnames -- and so is every unexported Go
# method call on a lowercase receiver (`rule.denies`, `cfg.allows`). Review
# pointed out the cost of that compromise: a plain two-label host assigned to a
# variable is one of the most routine configuration shapes there is, and it
# sailed through.
#
# The discriminator is position, not spelling. A hostname that is a *value* is
# quoted, or follows an `=` or a `:`, and then the token ends. An identifier in
# source code never looks like that. So this catches the assigned and YAML forms
# without dragging in every method call in the repository, and the file-name
# exception below still lets `boundary.go` past.
#
# The suffix must be a real registrable one, and it is no more the
# discriminator here than it is for the rule above: `store`, `name`, `now` and
# `mu` are all registrable, so `tc.value` is separated from a host but
# `h.p.store.mu` is not. Position does not rescue it either. A Go composite
# literal field is written `Host: rec.name,` -- a key, a colon, a value -- which
# is the shape this rule keys on, so the `:` branch reports struct literals.
#
# The list is therefore not tightened, and .go files step aside to the three
# Go-scoped rules further down. One of those, `apphub-hostname-go-yaml-key`,
# keeps this rule's reach over a YAML mapping line embedded in a Go raw string,
# which is a real bypass and not one to lose.
#
# The list below is every ASCII suffix IANA delegates (data.iana.org/TLD,
# version 2026081900), plus the private-use ones internal hosts actually take --
# internal, corp, lan, intranet, local and friends -- which IANA does not
# delegate and which are precisely what this rule exists to catch. It is the
# complete set rather than a short one on purpose: a short list was the round-3
# defect, where a synthetic host under an unlisted suffix walked through.
#
# Refresh it from IANA if a new suffix ever matters. The context-anchored rules
# below -- URLs, and YAML values, including the Go-scoped mapping-line rule --
# deliberately do NOT require a known suffix, so any host in a URL or a YAML
# value stays fail-closed whatever it ends in.
[[rules]]
id = "apphub-hostname-two-label"
description = "hostname assigned as a value that is not on the allowlist of hosts this repository may reference"
regex = '''(?:["'`]|(?:^|[^!<>=:])[:=][ \t]*)((?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:aaa|aarp|abb|abbott|abbvie|abc|able|abogado|abudhabi|ac|academy|accenture|accountant|accountants|aco|actor|ad|ads|adult|ae|aeg|aero|aetna|af|afl|africa|ag|agakhan|agency|ai|aig|airbus|airforce|airtel|akdn|al|alibaba|alipay|allfinanz|allstate|ally|alsace|alstom|am|amazon|americanexpress|americanfamily|amex|amfam|amica|amsterdam|analytics|android|anquan|anz|ao|aol|apartments|app|apple|aq|aquarelle|ar|arab|aramco|archi|army|arpa|art|arte|as|asda|asia|associates|at|athleta|attorney|au|auction|audi|audible|audio|auspost|author|auto|autos|aw|aws|ax|axa|az|azure|ba|baby|baidu|banamex|band|bank|bar|barcelona|barclaycard|barclays|barefoot|bargains|baseball|basketball|bauhaus|bayern|bb|bbc|bbt|bbva|bcg|bcn|bd|be|beats|beauty|beer|berlin|best|bestbuy|bet|bf|bg|bh|bharti|bi|bible|bid|bike|bing|bingo|bio|biz|bj|black|blackfriday|blockbuster|blog|bloomberg|blue|bm|bms|bmw|bn|bnpparibas|bo|boats|boehringer|bofa|bom|bond|boo|book|booking|bosch|bostik|boston|bot|boutique|box|br|bradesco|bridgestone|broadway|broker|brother|brussels|bs|bt|build|builders|business|buy|buzz|bv|bw|by|bz|bzh|ca|cab|cafe|cal|call|calvinklein|cam|camera|camp|canon|capetown|capital|capitalone|car|caravan|cards|care|career|careers|cars|casa|case|cash|casino|cat|catering|catholic|cba|cbn|cbre|cc|cd|center|ceo|cern|cf|cfa|cfd|cg|ch|chanel|channel|charity|chase|chat|cheap|chintai|christmas|chrome|church|ci|cipriani|circle|cisco|citadel|citi|citic|city|ck|cl|claims|cleaning|click|clinic|clinique|clothing|cloud|club|clubmed|cluster|cm|cn|co|coach|codes|coffee|college|cologne|com|commbank|community|company|compare|computer|comsec|condos|construction|consulting|contact|contractors|cooking|cool|coop|corp|corsica|country|coupon|coupons|courses|cpa|cr|credit|creditcard|creditunion|cricket|crown|crs|cruise|cruises|cu|cuisinella|cv|cw|cx|cy|cymru|cyou|cz|dad|dance|data|date|dating|datsun|day|dclk|dds|de|deal|dealer|deals|degree|delivery