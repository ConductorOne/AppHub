# Secret and disclosure scanning for a repository that is going public.
#
# The default gitleaks rules look for things that are secret because they are
# unguessable: keys, tokens, private key material. They found nothing here, and
# review pointed out why that is not reassuring. The disclosures this project
# actually has to avoid are not high-entropy at all:
#
#   * An AWS account ID is twelve digits. There is no entropy threshold that
#     separates one from a timestamp, so no generic scanner will ever flag it.
#     The source repository being ported from contains real ones.
#   * An internal hostname is just a hostname. The source repository contains
#     one of those too, in the deploy path.
#
# So this file adds rules for the *shape* of the disclosure rather than for any
# particular value. Deliberately so: writing the real account IDs into a
# denylist would publish them in the ruleset, which is the thing being
# prevented.
#
# `make secrets` runs these over the working tree and the full git history.
# `make secrets-selftest` plants a synthetic example of each class and fails if
# any rule stops firing.

[extend]
useDefault = true

# The default rule set does not catch an AWS access key assigned to the
# identifier AWS itself uses for it. Verified against the pinned version:
# `api_key = "AKIA..."` is reported and `aws_access_key_id = "AKIA..."` is not,
# because the generic rule allowlists that identifier as a configuration name.
# The key prefix is unambiguous on its own, so match it and ignore the context.
[[rules]]
id = "apphub-aws-access-key-id"
description = "AWS access key ID"
regex = '''\b(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}\b'''
tags = ["secret", "aws"]

# Review found the assignment rule missing a JSON account-id-shaped value: valid
# JSON where the closing quote sits between the key and the colon. That
# is one of the two most ordinary ways an account ID travels, so patching the
# regex to accept a quote would have been fixing the example rather than the
# class.
#
# So this rule takes the same posture as the hostname rule below: every
# standalone twelve-digit number is a finding, and legitimate ones are
# allowlisted deliberately. Twelve digits bounded by non-digits is a narrow
# enough shape that the noise is manageable -- a thirteen-digit millisecond
# timestamp does not match, because the boundary assertion fails against the
# digit on either side.
#
# The rules below it are kept even though this one subsumes them: they name what
# was found, and "an AWS account ID in an ARN" is a more useful thing to read at
# 2am than "a twelve-digit number".
[[rules]]
id = "apphub-twelve-digit-identifier"
description = "standalone twelve-digit number, the shape of an AWS account ID"
regex = '''\b[0-9]{12}\b'''
tags = ["disclosure", "aws", "account-id"]

  [[rules.allowlists]]
  description = "legitimate twelve-digit numbers, if this repository ever has one"
  condition = "AND"
  paths = ['''(?:^|/)store/cmd/devseed/application\.go$''']
  regexTarget = "match"
  regexes = [
    # AWS's own documentation example account ID (used throughout AWS's docs
    # for ARNs and IAM examples), reused here as devseed demo fixture data.
    # Scoped to this one file: an entry here is a claim that a specific
    # twelve-digit number is not an account ID, and should be justified in
    # the pull request that adds it.
    '''^123456789012$''',
  ]

[[rules]]
id = "apphub-aws-account-id-in-arn"
description = "AWS account ID in an ARN"
regex = '''arn:aws[a-z-]*:[a-z0-9-]*:[a-z0-9-]*:[0-9]{12}:'''
tags = ["disclosure", "aws", "account-id"]

[[rules]]
id = "apphub-aws-account-id-assignment"
description = "AWS account ID assigned to an account-shaped name"
regex = '''(?i)\b(?:aws[_-]?)?(?:account|owner)[_-]?id\b\s*[:=]+\s*["']?([0-9]{12})\b'''
tags = ["disclosure", "aws", "account-id"]

[[rules]]
id = "apphub-aws-ecr-registry-host"
description = "ECR registry hostname, which embeds the AWS account ID"
regex = '''\b[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com'''
tags = ["disclosure", "aws", "account-id"]

  [[rules.allowlists]]
  description = "the demo ECR registry host, built from AWS's documentation example account ID, used as devseed fixture data"
  condition = "AND"
  paths = ['''(?:^|/)store/cmd/devseed/application\.go$''']
  regexTarget = "match"
  regexes = ['''^123456789012\.dkr\.ecr\.us-east-1\.amazonaws\.com$''']

[[rules]]
id = "apphub-aws-infrastructure-identifier"
description = "AWS infrastructure identifier (VPC, subnet, security group, AMI, instance, ...)"
regex = '''\b(?:vpc|subnet|sg|igw|nat|rtb|acl|eni|vol|snap|ami)-(?:[0-9a-f]{8}|[0-9a-f]{17})\b'''
tags = ["disclosure", "aws", "infrastructure"]

# Hostnames are handled the way the import boundary is handled: everything is
# forbidden and the exceptions are a list somebody had to edit on purpose. An
# internal hostname does not look different from a public one, so the only rule
# that can catch one is a rule that catches all of them and then names the ones
# this repository is allowed to mention.
#
# The first version of this rule enumerated a short list of top-level domains,
# which meant it was not actually fail-closed: review walked a synthetic
# internal URL through it under `.co`. Enumerating suffixes is the same mistake
# as enumerating build tags -- the space is not ours to bound. So the suffix is
# now anything alphabetic.
#
# That costs precision on two-label names, because `boundary.go` and `ci.yml`
# are shaped exactly like hostnames. The split below is how the noise is kept
# down without reintroducing a suffix list:
#
#   * three or more labels is treated as a hostname whatever the suffix, since
#     three-label filenames are rare and internal hostnames are usually deep;
#   * two labels count only in a URL, an email address, or a value position,
#     where the token cannot be a filename;
#   * and in .go source, where every one of those shapes can also be an
#     expression, the token has to be data as well -- a string literal, a YAML
#     mapping line, a URL. The Go-scoped rules below do that, and the comment
#     above them has the argument for why nothing else can.
#
# Adding a host to the allowlist is cheap and reviewable. Missing an internal
# hostname in a public repository is neither.
#
# The suffix must be a real registrable one, and that requirement is not the
# discriminator it was taken for. It arrived because the rule fired on ordinary
# Go field chains -- `r.reply.body`, `tc.value` -- and `body`, `value`, `field`,
# `failed` and `reply` are not suffixes anybody can register. It held until the
# first large port arrived, and then failed on the same class, because `store`,
# `name`, `now` and `mu` ARE registrable: a mutex reached through a field named
# `store` reads as a three-label host, 218 times on one pull request.
#
# The list is therefore not tightened again. It was never the mistake, and a
# third fix to a rule that has been wrong twice in the same place guarantees a
# fourth. It stays as it is, doing the job it was added for in every file type
# where a dotted token cannot be an expression -- and .go files, where it can
# be, step aside to the three Go-scoped rules further down, which require the
# token to be data instead. The comment above those rules has the argument.
#
# The list below is every ASCII suffix IANA delegates (data.iana.org/TLD,
# version 2026081900), plus the private-use ones internal hosts actually take --
# internal, corp, lan, intranet, local and friends -- which IANA does not
# delegate and which are precisely what this rule exists to catch. It is the
# complete set rather than a short one on purpose: a short list was the round-3
# defect, where a synthetic host under an unlisted suffix walked through.
#
# Refresh it from IANA if a new suffix ever matters. The context-anchored rules
# below -- URLs, and YAML values, including the Go-scoped mapping-line rule --
# deliberately do NOT require a known suffix, so any host in a URL or a YAML
# value stays fail-closed whatever it ends in.
[[rules]]
id = "apphub-hostname-multilabel"
description = "three-or-more-label hostname that is not on the allowlist of hosts this repository may reference"
regex = '''\b(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.){2,}(?:aaa|aarp|abb|abbott|abbvie|abc|able|abogado|abudhabi|ac|academy|accenture|accountant|accountants|aco|actor|ad|ads|adult|ae|aeg|aero|aetna|af|afl|africa|ag|agakhan|agency|ai|aig|airbus|airforce|airtel|akdn|al|alibaba|alipay|allfinanz|allstate|ally|alsace|alstom|am|amazon|americanexpress|americanfamily|amex|amfam|amica|amsterdam|analytics|android|anquan|anz|ao|aol|apartments|app|apple|aq|aquarelle|ar|arab|aramco|archi|army|arpa|art|arte|as|asda|asia|associates|at|athleta|attorney|au|auction|audi|audible|audio|auspost|author|auto|autos|aw|aws|ax|axa|az|azure|ba|baby|baidu|banamex|band|bank|bar|barcelona|barclaycard|barclays|barefoot|bargains|baseball|basketball|bauhaus|bayern|bb|bbc|bbt|bbva|bcg|bcn|bd|be|beats|beauty|beer|berlin|best|bestbuy|bet|bf|bg|bh|bharti|bi|bible|bid|bike|bing|bingo|bio|biz|bj|black|blackfriday|blockbuster|blog|bloomberg|blue|bm|bms|bmw|bn|bnpparibas|bo|boats|boehringer|bofa|bom|bond|boo|book|booking|bosch|bostik|boston|bot|boutique|box|br|bradesco|bridgestone|broadway|broker|brother|brussels|bs|bt|build|builders|business|buy|buzz|bv|bw|by|bz|bzh|ca|cab|cafe|cal|call|calvinklein|cam|camera|camp|canon|capetown|capital|capitalone|car|caravan|cards|care|career|careers|cars|casa|case|cash|casino|cat|catering|catholic|cba|cbn|cbre|cc|cd|center|ceo|cern|cf|cfa|cfd|cg|ch|chanel|channel|charity|chase|chat|cheap|chintai|christmas|chrome|church|ci|cipriani|circle|cisco|citadel|citi|citic|city|ck|cl|claims|cleaning|click|clinic|clinique|clothing|cloud|club|clubmed|cluster|cm|cn|co|coach|codes|coffee|college|cologne|com|commbank|community|company|compare|computer|comsec|condos|construction|consulting|contact|contractors|cooking|cool|coop|corp|corsica|country|coupon|coupons|courses|cpa|cr|credit|creditcard|creditunion|cricket|crown|crs|cruise|cruises|cu|cuisinella|cv|cw|cx|cy|cymru|cyou|cz|dad|dance|data|date|dating|datsun|day|dclk|dds|de|deal|dealer|deals|degree|delivery|dell|deloitte|delta|democrat|