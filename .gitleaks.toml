  paths = ['''(?:^|/)compute/aws/container_test\.go$''']
  regexTarget = "secret"
  regexes = ['''^018f3f85-9b61-7b70-bc24-38426ea34e21$''']

  [[rules.allowlists]]
  description = "an obviously-fake Stripe-shaped test key, not a live credential"
