tags = ["disclosure", "hostname"]

  [[rules.allowlists]]
  description = "public hosts this repository legitimately references"
  regexTarget = "secret"
  regexes = [
    # Vendor API roots the credential providers must name in code. Each one is a
    # public, documented endpoint that resolves in public DNS -- verified rather
    # than taken on trust, since a hostname allowlist is exactly where an
    # internal host could hide behind a plausible-looking public one. Every
    # entry is exact-anchored: no apex is widened. For Datadog the list IS the
    # security control -- credentials/datadog refuses to send an admin key to any
    # host outside it (USOSS-7).
    '''^api\.github\.com$''',
    '''^accounts\.google\.com$''',
    '''^go\.yaml\.in$''',
    '''^api\.datadoghq\.com$''',
    '''^api\.datadoghq\.eu$''',
    '''^api\.us3\.datadoghq\.com$''',
    '''^api\.us5\.datadoghq\.com$''',
    '''^api\.ap1\.datadoghq\.com$''',
    '''^api\.ddog-gov\.com$''',
    '''^conductorone\.com$''',
    '''^www\.conductorone\.com$''',
    '''^c1\.ai$''',
    '''^www\.c1\.ai$''',
    '''^github\.com$''',
    '''^raw\.githubusercontent\.com$''',
    '''^objects\.githubusercontent\.com$''',
    '''^users\.noreply\.github\.com$''',
    '''^docs\.github\.com$''',
    '''^fonts\.googleapis\.com$''',
    '''^go\.dev$''',
    '''^pkg\.go\.dev$''',
    '''^golang\.org$''',
    '''^proxy\.golang\.org$''',
    '''^sum\.golang\.org$''',
    '''^gopkg\.in$''',
    '''^apache\.org$''',
    '''^www\.apache\.org$''',
    '''^developercertificate\.org$''',
    '''^contributor-covenant\.org$''',
    '''^www\.contributor-covenant\.org$''',
    '''^([a-z0-9-]+\.)*example\.(com|net|org)$''',
    '''^([a-z0-9-]+\.)*example$''',
    '''^([a-z0-9-]+\.)*invalid$''',
    '''^([a-z0-9-]+\.)*test$''',
    '''^([a-z0-9-]+\.)*localhost$''',
    # Kubernetes API group names and the cluster-internal DNS suffix, added by
    # USOSS-27. These are shaped like hostnames and are not hosts: an API group
    # is an identifier in the Kubernetes type system, and a provider that could
    # not name one could not write an object. Exact-anchored, so no apex is
    # widened -- in particular svc.cluster.local is allowed as the bare suffix
    # only, because a full <service>.<namespace>.svc.cluster.local name would
    # disclose an internal service and namespace and must stay a finding.
    '''^kubernetes\.io$''',
    '''^app\.kubernetes\.io$''',
    '''^networking\.k8s\.io$''',
    '''^gateway\.networking\.k8s\.io$''',
    '''^rbac\.authorization\.k8s\.io$''',
    '''^postgresql\.cnpg\.io$''',
    # The Kubernetes module apexes, added by USOSS-15. They appear in Go source
    # as import-path prefixes in the deploy module's substrate fence -- the rule
    # naming what modules/deploy may not depend on -- not as hosts anything
    # connects to. Exact-anchored like every entry here, so internal.k8s.io and
    # anything else under either apex stays a finding; hack/check-secret-rules.sh
    # asserts that.
    '''^k8s\.io$''',
    '''^sigs\.k8s\.io$''',
    '''^svc\.cluster\.local$''',
    # Public hosts the AWS deployment under terraform/ names. Each one is a
    # documented, publicly resolving endpoint and none of them is ours:
    # registry.terraform.io is where the provider lock file records what it
    # pinned, public.ecr.aws is AWS's public gallery, and the two ACME
    # directories are Let's Encrypt's -- the staging one exists so that bringing
    # the ingress up does not spend a week of production issuance quota.
    # Exact-anchored like every entry here, so no apex is widened.
    '''^registry\.terraform\.io$''',
    '''^public\.ecr\.aws$''',
    '''^acme-v02\.api\.letsencrypt\.org$''',
    '''^acme-staging-v02\.api\.letsencrypt\.org$''',
    '''^[a-z0-9-]+\.amazonaws\.com$''',
    '''^[a-z0-9-]+\.[a-z]{2}-[a-z]+-[0-9]\.amazonaws\.com$''',
  ]

  [[rules.allowlists]]
  description = "file names, which are shaped like hostnames and are not hosts"
  regexTarget = "secret"
  regexes = [
    '''\.(go|md|yml|yaml|toml|json|sum|mod|sh|txt|html|css|js|ts|py|tf|lock|tmpl|gotmpl|out|log|csv|xml|ini|cfg|conf|env|gitignore|gitleaksignore|dockerignore)$''',
  ]

  [[rules.allowlists]]
  description = "Go source, where this rule cannot tell a selector chain from a host"
  # Not a hostname exception: the same shapes are matched in .go files by the
  # three rules below, which require the token to be data rather than an
  # expression. Removing this without removing those re-opens 218 findings of
  # ordinary Go on the first large port.
  paths = ['''\.go$''']

  [[rules.allowlists]]
  description = "exact expressions and unit targets in the AWS deployment, not DNS names"
  condition = "AND"
  paths = ['''(?:^|/)terraform/.*\.(tf|tftpl)$''']
  regexTarget = "secret"
  # `p.id` and `each.value.name` are HCL property accesses; multi-user.target is
  # the systemd target the worker's unit installs into. Reviewed names, not a
  # blanket exemption for the tree -- a real two-label host in these files is
  # still a finding.
  regexes = [
    '''^p\.id$''',
    '''^each\.value\.name$''',
    '''^multi-user\.target$''',
  ]

  [[rules.allowlists]]
  description = "the cluster module's Terraform address, an HCL module path not a host"
  condition = "AND"
  paths = ['''^Makefile$''', '''(?:^|/)terraform/modules/build/main\.tf$''']
  regexTarget = "secret"
  regexes = ['''^module\.cluster$''']

  [[rules.allowlists]]
  description = "the bucket zone field identifier in the application form"
  condition = "AND"
  paths = ['''(?:^|/)frontend/src/components/ApplicationForm\.tsx$''']
  regexTarget = "secret"
  regexes = ['''^bucket\.zone$''']

  [[rules.allowlists]]
  description = "exact property-access expressions in the C1 design system portal, not DNS names"
  condition = "AND"
  paths = ['''(?:^|/)frontend/src/.*\.tsx?$''']
  regexTarget = "secret"
  # Keep source files under all secret/URL rules. These are reviewed expression
  # names, not a blanket TypeScript exemption or permission for their subdomains.
  # `.bg`/`.id`/`.dot` are design-token property names (background color, id,
  # status dot) that happen to end in registrable suffixes.
  regexes = [
    '''^c\.bg$''',
    '''^t\.id$''',
    '''^s\.bg$''',
    '''^meta\.dot$''',
    '''^owner\.email$''',
    '''^owner\.id$''',
    '''^app\.id$''',
    '''^app\.live$''',
    '''^bar\.total$''',
    '''^usage\.data$''',
    '''^published\.internal$''',
    '''^entitlements\.data$''',
    '''^flags\.data$''',
    '''^mappings\.data$''',
    '''^members\.data$''',
    '''^app\.specification\.name$''',
    '''^application\.specification\.name$''',
  ]

# Go source: the same shapes, but only where the token is data.
#
# The two rules above ask what a token looks like. In Go that question has no
# answer, because a selector chain and a hostname are the same string --
# `h.p.store.mu` against a three-label internal host. Two rounds of tightening
# the suffix list proved it, and the `store/` import fence reached the same
# conclusion from the other direction: it stopped reading import strings out of
# the file and asks the toolchain instead (`go list -e -deps -test -json`, in
# internal/boundary/load.go), so it compares what the compiler resolves rather
# than what the text says.
#
# What can be answered is where the token sits. A hostname that has been
# disclosed is data -- a string literal, a struct tag (which is a string
# literal), a URL, a YAML value. A selector chain is an expression, and is never
# quoted. So each shape rule above gets a Go-scoped counterpart whose only
# difference is that requirement. No existing regex is modified.
#
# The disclosure this repository is being ported away from is an internal domain
# inside a Go string literal, embedded in a format string. That is the shape
# these rules exist to keep catching, and hack/check-secret-rules.sh plants it.
#
# Given up deliberately, and what still covers it:
#
#   * A bare host in a Go comment that is not in a URL.
#     `apphub-hostname-in-url` still catches it with a scheme, at any suffix.
#     Measured on the first large port: all six comment-borne findings were
#     Kubernetes API group names, and none was a hostname.
#   * A host in a Go raw string spanning lines, with neither a `key:` nor a
#     block indicator. `apphub-hostname-block-scalar` already stepped aside
#     there, for the reason recorded on that rule.
#
# NOT closed by these rules, and not closable by any of them: a domain-shaped
# token that is an identifier rather than a host -- a Kubernetes API group, or a
# map key spelled like a two-label host. Inside a string literal those are
# character-for-character indistinguishable from a hardcoded internal host in
# the same position, so no matching rule can separate them. Which third-party
# namespaces this repository may name is a policy question, not a regex defect,
# and it is left open here rather than answered with an allowlist entry that
# would blind the rule to a whole apex.

[[rules]]
id = "apphub-hostname-go-string"
description = "three-or-more-label hostname inside a Go string literal that is not on the allowlist of hosts this repository may reference"
