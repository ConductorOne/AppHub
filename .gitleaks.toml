  [[rules.allowlists]]
  description = "Go source: a lone indented dotted token is more likely an identifier than a host"
  # Narrow, and paired. An embedded YAML document inside a Go raw string stays
  # in scope through apphub-hostname-block-scalar-indicator below, which
  # requires the `key: |` line that makes it a block scalar. What this exemption
  # gives up is only the case with no indicator at all -- an indented lone
  # dotted token in Go source -- which is exactly the case that cannot be told
  # apart from a subtest or metric name.
  paths = ['''\.go$''']

# The same hostname, in a block scalar that says so.
#
# The rule above keys on shape alone -- a lone indented dotted token -- which is
# ambiguous with ordinary Go source: an identifier such as a subtest or metric
# name, indented inside a raw string, looks identical. That ambiguity cannot be
# resolved by spelling. Hyphens, casing, and suffix plausibility all fail on the
# obvious counterexamples, and enumerating registrable suffixes is the mistake
# this file already made once.
#
# What does separate them is the surrounding syntax. A YAML block scalar is
# introduced: some `key:` line ends in `|` or `>`, and the value follows
# indented beneath it. A Go raw string full of identifiers has no such line.
#
# So this rule requires the indicator, and therefore applies everywhere --
# including .go files, where it is what keeps an embedded YAML document in
# scope while the shape-only rule above steps aside. The lazy repetition lets
# the hostname sit on any line of the block rather than only the first; one
# finding per block is enough to fail the build and send someone to read it.
