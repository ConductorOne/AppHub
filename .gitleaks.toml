  paths = ['''(?:^|/)credentials/c1directory/client_test\.go$''']
  regexTarget = "secret"
  regexes = ['''^sk_live_abc123$''']

[[rules]]
id = "private-key"
# extend.useDefault = true above means this block is merged into gitleaks'
# built-in private-key rule; only this allowlist is appended.

  [[rules.allowlists]]
  description = "a fake, invalid PEM body used only to exercise file-permission and storage-roundtrip behavior, not a real key. The regex reproduces gitleaks' own (non-greedy) match verbatim, which sweeps in the surrounding assertions because the fixture is reused verbatim later in the same test and the non-greedy regex stops at that second occurrence rather than the first"
  condition = "AND"
  paths = ['''(?:^|/)internal/ghappkey/local_test\.go$''']
  regexTarget = "secret"
  regexes = [
    '''^-----BEGIN RSA PRIVATE KEY-----\\nfirst\\n-----END RSA PRIVATE KEY-----\\n"\)\); err != nil \{
		t\.Fatal\(err\)
	\}
	info, err := os\.Stat\(path\)
	if err != nil \{
		t\.Fatal\(err\)
	\}
	if info\.Mode\(\)\.Perm\(\) != 0o600 \{
		t\.Fatalf\("key file mode = %v, want 0600", info\.Mode\(\)\.Perm\(\)\)
	\}
	if exists, err := store\.Exists\(ctx\); err != nil \|\| !exists \{
		t\.Fatalf\("Exists after Put = \(%v, %v\), want \(true, nil\)", exists, err\)
	\}
	got, err := reader\.Get\(ctx\)
	if err != nil \{
		t\.Fatal\(err\)
	\}
	if credentials\.Reveal\(got\) != "-----BEGIN RSA PRIVATE KEY-----$''',
  ]

