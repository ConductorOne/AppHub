id = "apphub-hostname-block-scalar-indicator"
description = "hostname inside an introduced YAML block scalar that is not on the allowlist"
regex = '''(?m)^[ \t]*[A-Za-z0-9_.-]+:[ \t]*[|>][-+0-9]*[ \t]*\r?\n(?:[ \t]+[^\n]*\r?\n)*?[ \t]+((?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63})[ \t]*$'''
