tags = ["disclosure", "hostname"]

  [[rules.allowlists]]
  description = "public hosts this repository legitimately references"
  regexTarget = "secret"
  regexes = [
    # Vendor API roots the credential providers must name in code. Each one is a
    # public, documented endpoint that resolves in public DNS -- verified rather
    # than taken on trust, since a hostname allowlist is exactly where an
    # internal host could hide behind a plausible-looking public one. Every
    # entry is exact-anchored: no apex is widened. For Datadog the list IS the
    # security control -- credentials/datadog refuses to send an admin key to any
    # host outside it (USOSS-7).
    '''^api\.github\.com$''',
    '''^accounts\.google\.com$''',
    '''^go\.yaml\.in$''',
    '''^api\.datadoghq\.com$''',
    '''^api\.datadoghq\.eu$''',
    '''^api\.us3\.datadoghq\.com$''',
    '''^api\.us5\.datadoghq\.com$''',
    '''^api\.ap1\.datadoghq\.com$''',
    '''^api\.ddog-gov\.com$''',
    '''^conductorone\.com$''',
    '''^www\.conductorone\.com$''',
    '''^c1\.ai$''',
    '''^www\.c1\.ai$''',
    '''^github\.com$''',
    '''^raw\.githubusercontent\.com$''',
    '''^objects\.githubusercontent\.com$''',
    '''^users\.noreply\.github\.com$''',
    '''^docs\.github\.com$''',
    '''^fonts\.googleapis\.com$''',
    '''^go\.dev$''',
    '''^pkg\.go\.dev$''',
    '''^golang\.org$''',
    '''^proxy\.golang\.org$''',
    '''^sum\.golang\.org$''',
    '''^gopkg\.in$''',
    '''^apache\.org$''',
    '''^www\.apache\.org$''',
    '''^developercertificate\.org$''',
    '''^contributor-covenant\.org$''',
    '''^www\.contributor-covenant\.org$''',
    '''^([a-z0-9-]+\.)*example\.(com|net|org)$''',
    '''^([a-z0-9-]+\.)*example$''',
    '''^([a-z0-9-]+\.)*invalid$''',
    '''^([a-z0-9-]+\.)*test$''',
    '''^([a-z0-9-]+\.)*localhost$''',
    '''^[a-z0-9-]+\.amazonaws\.com$''',
    '''^[a-z0-9-]+\.[a-z]{2}-[a-z]+-[0-9]\.amazonaws\.com$''',
    # Kubernetes API group names and the cluster-internal DNS suffix, added by
    # USOSS-27 and re-applied here when main moved the Go cases into their own
    # rules. These are shaped like hostnames and are not hosts: an API group is
    # an identifier in the Kubernetes type system, and a provider that could not
    # name one could not write an object. They reach this rule rather than the
    # generic ones because in Go they are written as string literals, which is
    # exactly what this rule looks for.
    #
    # Exact-anchored, so no apex is widened -- in particular svc.cluster.local is
    # allowed as the bare suffix only, because a full
    # <service>.<namespace>.svc.cluster.local name would disclose an internal
    # service and namespace and must stay a finding.
    '''^kubernetes\.io$''',
    '''^app\.kubernetes\.io$''',
    '''^networking\.k8s\.io$''',
    '''^gateway\.networking\.k8s\.io$''',
    '''^rbac\.authorization\.k8s\.io$''',
    '''^postgresql\.cnpg\.io$''',
    # The Kubernetes module apexes, added by USOSS-15. They appear in Go source
    # as import-path prefixes in the deploy module's substrate fence -- the rule
    # naming what modules/deploy may not depend on -- not as hosts anything
    # connects to. Exact-anchored like every entry here, so internal.k8s.io and
    # anything else under either apex stays a finding; hack/check-secret-rules.sh
    # asserts that.
    '''^k8s\.io$''',
    '''^sigs\.k8s\.io$''',
    '''^svc\.cluster\.local$''',
    # Public hosts the AWS deployment under terraform/ names. Each one is a
    # documented, publicly resolving endpoint and none of them is ours:
    # registry.terraform.io is where the provider lock file records what it
    # pinned, public.ecr.aws is AWS's public gallery, and the two ACME
    # directories are Let's Encrypt's -- the staging one exists so that bringing
    # the ingress up does not spend a week of production issuance quota.
    # Exact-anchored like every entry here, so no apex is widened.
    '''^registry\.terraform\.io$''',
    '''^public\.ecr\.aws$''',
    '''^acme-v02\.api\.letsencrypt\.org$''',
    '''^acme-staging-v02\.api\.letsencrypt\.org$''',
  ]

  [[rules.allowlists]]
  description = "file names, which are shaped like hostnames and are not hosts"
  regexTarget = "secret"
  regexes = [
    '''\.(go|md|yml|yaml|toml|json|sum|mod|sh|txt|html|css|js|ts|py|tf|lock|tmpl|gotmpl|out|log|csv|xml|ini|cfg|conf|env|gitignore|gitleaksignore|dockerignore)$''',
  ]

  [[rules.allowlists]]
  description = "Docker's reverse-DNS network-option namespace, not a connection destination"
  regexTarget = "secret"
  regexes = ['''^com\.docker\.network$''']

  [[rules.allowlists]]
  description = "the Traefik label key this test asserts on, mirroring the terraform allowlist entries"
  condition = "AND"
  paths = ['''(?:^|/)compute/aws/container_test\.go$''']
  regexTarget = "secret"
  regexes = ['''^traefik\.http\.services$''']

  [[rules.allowlists]]
  description = "the demo ECR registry host, a well-known AWS documentation example account ID used as devseed fixture data"
  condition = "AND"
  paths = ['''(?:^|/)store/cmd/devseed/application\.go$''']
  regexTarget = "secret"
  regexes = ['''^123456789012\.dkr\.ecr\.us-east-1\.amazonaws\.com$''']

  [[rules.allowlists]]
  description = "adversarial redirect-rejection fixture, not a host this repository references"
  condition = "AND"
  paths = ['''(?:^|/)internal/oauth/clients_test\.go$''']
  regexTarget = "secret"
  regexes = ['''^localhost\.evil\.com$''']

# The two-label form, as a value: the whole string literal is the host.
#
# The rule above needs three labels, for the reason its own comment gives -- a
# quoted `boundary.go` is shaped exactly like a two-label host. The two-label
# rule this mirrors resolved that by position, and inside Go the position is a
# quote on each side of the token with nothing between. A Go import path fails
# that test, because the domain is followed by a slash.
