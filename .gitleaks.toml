# The same hostname, on its own line.
#
# A YAML block scalar puts the value on a following line:
#
#     host: |
#       <a two-label internal host>
#     host: >-
#       <a two-label internal host>
#
# The position rule above keys on adjacency to the `:`, and the `|` or `>-`
# indicator breaks it -- the continuation line has neither a quote nor a
# separator. Block scalars are an ordinary way to write a YAML value, so this is
# not an encoded spelling.
#
# The shape that catches it without catching source code: a line whose entire
# content is indentation and one hostname-shaped token. A Go method call has
# parentheses, a list item has a dash, a comment has words after it. A bare
# dotted token alone on an indented line is a value.
[[rules]]
id = "apphub-hostname-block-scalar"
description = "hostname alone on an indented line, as in a YAML block scalar, that is not on the allowlist"
regex = '''(?m)^[ \t]+((?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63})[ \t]*$'''
secretGroup = 1
tags = ["disclosure", "hostname"]

