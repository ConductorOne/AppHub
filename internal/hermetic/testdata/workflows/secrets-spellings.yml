# The secrets context reached by every route GitHub offers.
name: spellings
on: [push]
env:
  DOTTED: ${{ secrets.SOME_TOKEN }}
  BRACKETED: ${{ secrets['SOME_TOKEN'] }}
  VIA_FUNCTION: ${{ toJSON(secrets) }}
  FOLDED: >-
    ${{
      secrets.SOME_TOKEN
    }}
jobs:
  in-a-list:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ secrets.SOME_TOKEN }}
