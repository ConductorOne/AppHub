name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_CONFIG_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - run: make secrets
