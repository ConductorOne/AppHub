# Pinning actions to commit SHAs makes them immutable, which also makes them
# invisible to a human reading the diff for "is this current?". Dependabot is
# the other half of that trade: it opens the pull request that moves the pin,
# with the tag it corresponds to in the message.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
