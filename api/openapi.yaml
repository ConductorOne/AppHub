  /api/v1/applications/{id}/deletion:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: deleteApplication
      tags: [Applications]
      summary: Durably accept deletion of an application and every resource it owns
      security:
        - SessionCookie: []
        - OAuth: ['applications:write']
      description: |
        Queues a teardown operation that removes the application's workload,
        database, key-value table, bucket (emptied first), secrets, workload
        identity and image repository, then its hostname reservations,
        deployment history and the application itself. Data is destroyed without
        a snapshot. confirmName must equal the application's current name.

        The owner or an administrator may delete. A queued deployment is
        cancelled; a running one returns 409 until it finishes; an interrupted
        one is superseded. Once accepted the application is read-only for good:
        it cannot be updated or deployed, only deleted.

        Poll statusUrl like a deployment. Transient provider failures are
        retried with backoff, and a teardown whose worker stops is requeued
        automatically. If a teardown fails, status becomes deletion_failed and
        calling this again (with a new idempotency key) retries it; every step is
        idempotent. When the teardown succeeds the application and its
        operations return 404.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ConditionalOrigin'
        - $ref: '#/components/parameters/ConditionalCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteApplicationInput'
      responses:
        '202':
          description: Durable teardown accepted, not confirmed deleted; poll statusUrl.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Retry-After:
              description: Wait two seconds before polling the durable status resource.
              schema:
                type: integer
                const: 2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAccepted'
        '204':
          description: The application had never been deployed, so it and its records were deleted immediately. There is nothing to poll.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidSpecification'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
