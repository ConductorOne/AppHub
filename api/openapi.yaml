openapi: 3.1.0
info:
  title: AppHub control plane
  version: 1.0.0
  description: |
    Organization application and durable deployment API. This document is the wire
    contract for browser, CLI, SDK, and MCP adapter inputs and results. All API
    paths are relative to the operator-configured public origin. Production uses
    HTTPS; HTTP is allowed only on an explicitly configured literal loopback
    development origin. Origins and OAuth resources are never inferred from Host
    or forwarded headers.

    Users authenticate through an admitted Google or OIDC identity. Exact issuer
    and subject identify an account; equal email addresses never merge accounts.
    Eligibility, local disablement, admission, and operator-configured admin role
    are checked on each request. Ordinary users can access only their own
    applications and deployments. Admins can operate any application. Inaccessible
    object IDs return 404, before revealing scope failures on another owner's
    objects. Known accessible objects with insufficient scope return 403.

    API requests support a browser session OR an opaque AppHub OAuth bearer token
    for the exact resource {publicOrigin}/api. POST /api/v1/github/webhook is the
    exception: GitHub authenticates with X-Hub-Signature-256, and a session or
    bearer token is not a credential there. If Authorization is present, bearer
    authentication is selected exclusively; an invalid bearer never falls back to
    cookies. Upstream ID tokens and tokens for {publicOrigin}/mcp are not API
    credentials. Browser mutations require both exact Origin and session-bound
    X-CSRF-Token. Missing Origin is not accepted for cookie mutations. These
    requirements are conditional on cookie authentication, not on bearer requests.
    Sessions expire after 24 hours. Local policy changes are immediate; upstream
    deprovisioning is not claimed to be immediate without an upstream signal.

    JSON request bodies are capped at 128 KiB; persisted application specifications
    at 64 KiB. Unknown request fields are rejected rather than ignored. Validation
    does not cause cloud side effects. Failure messages are service-authored safe
    text; raw provider errors, credentials, build logs, and stack traces are never
    returned. Dependency failures return 503, never a fabricated empty inventory.

    Create and submit use separate, required Idempotency-Key values. A key is
    scoped to principal and operation; the same key and canonical request return
    the original IDs, while different content returns 409 idempotency_conflict.
    Retention is at least the lifetime of the corresponding resource. Preserve
    keys across uncertain network outcomes. A 202 means durable acceptance, not
    deployment readiness. The worker runs independently of HTTP disconnection.

    Remote MCP uses the official stateless Streamable HTTP transport at /mcp and
    the separate resource {publicOrigin}/mcp. It accepts bearer only, checks Origin
    when present, and uses these same service DTOs, scope rules, and idempotency
    semantics. Its protocol envelope is defined by MCP, not a second REST schema.
servers:
  - url: /
tags:
  - name: Authentication
  - name: Targets
  - name: Detections
  - name: Workspace
  - name: Applications
  - name: Deployments
  - name: Sessions
  - name: OAuth
security:
  - SessionCookie: []
  - OAuth: []
paths:
  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      tags: [Authentication]
      summary: List configured sign-in choices
      security: []
      responses:
        '200':
          description: Safe provider descriptions; no admission rules or client secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvidersResponse'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/{providerId}/login:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    get:
      operationId: beginLogin
      tags: [Authentication]
      summary: Start browser Google or OIDC login
      security: []
      description: |
        Redirects to the selected provider with state, nonce, and S256 PKCE. A
        five-minute single-use transaction binds provider, issuer, client,
        callback, browser, and return target. A separate host-only HttpOnly
        SameSite=Lax Secure login cookie per transaction allows concurrent tabs
        and providers. Cookie names use __Host-apphub_login_<state-hash-prefix>;
        only explicit loopback HTTP omits __Host-. Nonce and verifier are encrypted
        server-side and never returned to application clients.
      parameters:
        - name: return_to
          in: query
          description: |
            Local path to visit after login; fallback is /applications. URL parsing
            rejects schemes, authorities, backslashes, controls, protocol-relative
            paths, and encoded equivalents. It is not an arbitrary redirect URL.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the configured identity provider.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: Unique browser-binding transaction cookie; never a provider token.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/{providerId}/callback:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    get:
      operationId: completeLogin
      tags: [Authentication]
      summary: Consume a browser-bound upstream login response
      security: []
      description: |
        Requires the matching transaction cookie and provider binding. State and
        transaction expiry are checked and the transaction is atomically consumed
        before code exchange. Provider signature, issuer, audience, expiry, nonce,
        nonempty subject, UserInfo subject, and verified-email admission are
        verified. The transaction cookie is cleared on every outcome. Successful
        login establishes a fresh 24-hour session and redirects only to the bound
        safe local return path. Upstream tokens are discarded. Replayed, expired,
        mismatched, or invalid transactions never create a session.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: code
          in: query
          description: Required for a successful upstream response; mutually exclusive with error.
          schema:
            type: string
        - name: error
          in: query
          description: Upstream denial/error; never rendered without safe classification.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the bound return path after establishing a session.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              description: Host-only session cookie; Secure, HttpOnly, SameSite=Lax, Path=/, no Domain.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/logout:
    post:
      operationId: logoutBrowser
      tags: [Authentication]
      summary: Revoke the current browser session
      security:
        - SessionCookie: []
      description: |
        Revokes only the current browser session, not OAuth families or other
        browsers. Clears the cookie only after durable revocation succeeds.
        Failure remains retryable; a storage failure must not look like logout.
      parameters:
        - $ref: '#/components/parameters/RequiredOrigin'
        - $ref: '#/components/parameters/RequiredCSRF'
      responses:
        '204':
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              description: Expired session cookie with the original path and security attributes.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Read the effective current identity and permissions
      description: |
        Any valid nonempty granted OAuth scope suffices. Cookie callers receive
        their session-bound CSRF token; bearer callers do not. Role is
        derived from exact operator-configured providerId and subject
        (auth.admins, always admin) or, where a directory is configured, from
        an admin-mapped directory entitlement the identity currently holds --
        never email domain either way.
      responses:
        '200':
          description: Current eligible profile, role, identity, and actions.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/targets:
    get:
      operationId: listTargets
      tags: [Targets]
      summary: List safe operator-managed deployment options
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: |
        No account, IAM, certificate, resource prefix, network, AWS configuration,
        or source credential fields are exposed. ready requires a worker descriptor
        no older than 60 seconds whose configuration hash matches API policy.
        Unsupported data kinds and execution modes must not be offered by clients.
      responses:
        '200':
          description: Enabled targets and policy-constrained supported options.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TargetView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/categories:
    get:
      operationId: listCategories
      tags: [Applications]
      summary: List the categories an application may be assigned
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: Fixed server-defined set used to group applications in the portal.
      responses:
        '200':
          description: Every assignable category, in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/targets/{id}/detect:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: detectRepository
      tags: [Detections]
      summary: Durably queue an advisory Dockerfile/database scan of an approved repository
      security:
        - SessionCookie: []
        - OAuth: ['applications:write']
      description: |
        Application owners and workspace administrators may request a scan;
        members cannot queue repository reads even with applications:write.
        For the "simple deploy" flow: given a target and a repository URL that
        the target's operator list or GitHub App installation allows, best-effort
        discover a Dockerfile, its EXPOSE port, any docker-compose services, and
        a managed database guess ahead of creating or editing an application.
        The scan runs in the isolated worker, never in this authenticated API
        process, which holds no source credentials; this endpoint only durably
        queues the request and returns where to poll for the result. Everything
        returned is advisory: a caller must fall back to its own defaults
        rather than treating an empty or failed result as fatal.
      parameters:
        - $ref: '#/components/parameters/ConditionalOrigin'
        - $ref: '#/components/parameters/ConditionalCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionInput'
      responses:
        '202':
          description: Durable scan accepted; poll statusUrl.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidSpecification'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/detections/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getDetection
      tags: [Detections]
      summary: Poll an advisory repository scan
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: Visible only to the requester who queued it, or an administrator; a foreign ID reports 404, not 403.
      responses:
        '200':
          description: Current scan state; result is present only once state is succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/github-app:
    get:
      operationId: getGitHubAppStatus
      tags: [Workspace]
      summary: Read the admin-managed GitHub App's safe status
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: |
        Administrator only. Never returns the private key. available is false
        when this deployment has not configured GitHubAppAdmin at all, in
        which case every other field is zero and the Workspace should show
        setup instructions rather than a form.
      responses:
        '200':
          description: Current status, including synced installations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppStatusView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: setGitHubAppConfig
      tags: [Workspace]
      summary: Replace the admin-managed GitHub App's identity and private key
      security:
        - SessionCookie: []
        - OAuth: ['applications:write']
      description: |
        Administrator only. Full replacement, not a patch. privateKey is
        three-valued: the exact string "MASKED:****" keeps the currently
        stored key unchanged (send it back after reading a status response,
        which never contains the real key), an empty string clears the
        stored key, and any other value replaces it after being validated as
        parseable RS256 key material for the given appId. A replacement key
        is written to durable storage before this deployment's record is
        updated; it is never returned in any response.
      parameters:
        - $ref: '#/components/parameters/ConditionalOrigin'
        - $ref: '#/components/parameters/ConditionalCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAppConfigInput'
      responses:
        '200':
          description: Updated status, including synced installations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppStatusView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidSpecification'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/github-app/manifest:
    post:
      operationId: startGitHubAppManifest
      tags: [Workspace]
      summary: Begin creating the admin-managed GitHub App via GitHub's App Manifest flow
      security:
        - SessionCookie: []
        - OAuth: ['applications:write']
      description: |
        Administrator only. Durably records a short-lived, single-use state
        token bound to this administrator and returns the manifest JSON and
        target URL a browser must submit as a form POST to GitHub. GitHub
        creates the App after the administrator reviews and confirms it
        there, then redirects the browser to
        /api/v1/admin/github-app/manifest/callback with a one-time code and
        this same state. This flow only ever creates the App against
        github.com; a GitHub Enterprise Server operator continues to use PUT
        /api/v1/admin/github-app.
      parameters:
        - $ref: '#/components/parameters/ConditionalOrigin'
        - $ref: '#/components/parameters/ConditionalCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubAppManifestInput'
      responses:
        '200':
          description: The manifest and target URL to submit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppManifestStart'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidSpecification'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/github-app/manifest/callback:
    get:
      operationId: completeGitHubAppManifest
      tags: [Workspace]
      summary: Consume GitHub's redirect back from the App Manifest flow
      security:
        - SessionCookie: []
        - OAuth: ['applications:write']
      description: |
        A browser lands here only via GitHub's own redirect after
        startGitHubAppManifest, never called directly. state must name a
        still-valid, not-yet-consumed token the same administrator's own
        earlier call created -- consumed before anything else, so a replayed
        or shared callback URL can never re-exchange the same GitHub-issued
        code twice. Always redirects into the Workspace, success or failure,
        never a JSON body a browser navigation would just display raw.
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect into the Workspace's GitHub App tab, reporting success or a safe error reason.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
  /api/v1/github/webhook:
    post:
      operationId: receiveGitHubWebhook
      tags: [Workspace]
      summary: Receive a GitHub App webhook
      security: []
      description: |
        GitHub delivers App webhooks here. Authentication is the
        X-Hub-Signature-256 HMAC of the raw body, using the webhook secret
        injected from Parameter Store into the API container. A browser
        session or an API token is not a credential for this route. A
        missing secret, a missing signature, or a signature that does not
        match is rejected with an empty 401. A verified delivery is
        acknowledged with 204 and is not applied to installation records.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The signature matched. The delivery is acknowledged.
        '401':
          description: The signature is missing, malformed, or does not match. Empty body.
        '413':
          description: The body exceeds 1 MiB.
        '415':
          description: Content-Type is not application/json.
  /api/v1/admin/github-app/installations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      operationId: forgetGitHubAppInstallation
      tags: [Workspace]
      summary: Forget a locally synced GitHub App installation
      security:
        - SessionCookie: []
        - OAuth: ['applications:write']
      description: Administrator only. Removes only the local record; it does not uninstall the app from GitHub. If the installation still exists there, the worker's next periodic sync recreates it.
      parameters:
        - $ref: '#/components/parameters/ConditionalOrigin'
        - $ref: '#/components/parameters/ConditionalCSRF'
      responses:
        '204':
          description: Forgotten.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [Workspace]
      summary: List recorded workspace mutations
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: |
        Administrator only. Returns newest entries first from the separate
        audit store. Cursors are opaque; pass the returned cursor unchanged to
        continue. Audit entries contain only server-selected nonsecret metadata,
        never request bodies, secret values, credentials, or tokens.
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries on this page; defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: Opaque continuation returned by the preceding page.
          schema:
            type: string
      responses:
        '200':
          description: One page of recorded audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/log-groups:
    get:
      operationId: listLogGroups
      tags: [Workspace]
      summary: List the operator-named log groups the Workspace may read
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: Administrator only. Empty when this deployment has not configured Observability.
      responses:
        '200':
          description: Operator-chosen display names, not raw CloudWatch log group names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/logs/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: One of the operator-chosen display names listLogGroups returns.
        schema:
          type: string
          minLength: 1
    get:
      operationId: queryLogs
      tags: [Workspace]
      summary: Read one bounded page of a named log group
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: |
        Administrator only. start and end are RFC 3339 timestamps; both are
        required together, or both omitted to default to the last hour. The
        window is bounded to 7 days. filter is CloudWatch's own
        filter-pattern syntax, passed through unmodified.
      parameters:
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
        - name: filter
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: nextToken
          in: query
          schema:
            type: string
            maxLength: 8192
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      responses:
        '200':
          description: One page of matching log events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidSpecification'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/members:
    get:
      operationId: listMembers
      tags: [Workspace]
      summary: List every AppHub user who has signed in at least once
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: |
        Administrator only. There is no invite flow: an identity's User
        record is created automatically on its first admitted sign-in, so a
        person who has never signed in never appears here. Role is resolved
        live from currently held directory entitlements, the same
        computation UserView.role applies at sign-in -- it is not a stored
        per-user field.
      responses:
        '200':
          description: Every persisted user, most recently active first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/directory/entitlements:
    get:
      operationId: listDirectoryEntitlements
      tags: [Workspace]
      summary: List entitlements synced from an operator-configured identity directory
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: Administrator only. Empty when this deployment has not configured a directory source, or none has synced yet.
      responses:
        '200':
          description: Every entitlement last synced from the directory.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryEntitlementView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/role-mappings:
    get:
      operationId: listRoleMappings
      tags: [Workspace]
      summary: List every directory entitlement mapped to an AppHub role
      security:
        - SessionCookie: []
        - OAuth: ['applications:read']
      description: Administrator only. Joined with the entitlement's synced display name where still available.
      responses:
        '200':
          description: Every configured role mapping.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleMappingView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
